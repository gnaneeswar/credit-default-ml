# docker compose up --build
#   1. train : trains, evaluates and registers @champion into ./mlruns (then exits 0)
#   2. serve : starts only after train completed successfully; serves on :8000
# Optional batch scoring against the running API:
#   docker compose --profile score run --rm --no-deps score
#
# Containers run as your host user so files written to ./mlruns and ./artifacts stay yours.
# Defaults to 1000:1000; otherwise run: UID=$(id -u) GID=$(id -g) docker compose up --build
name: credit-default-ml

x-runtime-user: &runtime-user "${UID:-1000}:${GID:-1000}"

services:
  train:
    build:
      context: .
      dockerfile: Dockerfile.train
    image: credit-default-train:latest
    platform: linux/amd64
    user: *runtime-user
    volumes:
      - ./mlruns:/app/mlruns
      - ./artifacts:/app/artifacts

  serve:
    build:
      context: .
      dockerfile: Dockerfile.serve
    image: credit-default-serve:latest
    platform: linux/amd64
    user: *runtime-user
    depends_on:
      train:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./mlruns:/app/mlruns

  score:
    image: credit-default-train:latest
    platform: linux/amd64
    user: *runtime-user
    profiles: ["score"]
    command: ["python", "-m", "src.inference.batch_client", "--url", "http://serve:8000"]
    volumes:
      - ./artifacts:/app/artifacts
